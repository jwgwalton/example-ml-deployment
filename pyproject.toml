[project]
name = "wine-classifier"
version = "0.1.0"
description = "ML deployment pipeline with sklearn and MLFlow"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn==1.3.2",
    "mlflow==3.5.0",
    "pandas==2.1.4",
    "numpy==1.26.2",
    "flask==3.0.0",
]

[project.optional-dependencies]
dev = [
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
